<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Политика конфиденциальности — Модус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0E1116;--paper:#F4F1EA;--line-soft:#dfd9cc;--amber:#D9863A;--muted:#6B7280}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Manrope',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:64px 32px}
  header{border-bottom:1px solid var(--line-soft);padding:24px 0;margin-bottom:48px}
  .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em;font-size:20px;text-decoration:none;color:var(--ink)}
  .brand .mark{width:34px;height:34px;background:var(--ink);color:var(--paper);border-radius:6px;display:grid;place-items:center;font-weight:900;font-family:'Fraunces',serif;font-size:20px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:48px;letter-spacing:-.025em;line-height:1;margin:0 0 32px}
  .placeholder{padding:48px 32px;background:#fff;border:1px dashed var(--line-soft);border-radius:6px;color:var(--muted);font-size:15px;line-height:1.6}
  .back{margin-top:48px;display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0 32px">
    <a class="brand" href="/"><span class="mark">М</span><span>Модус</span></a>
  </div>
</header>
<main class="wrap">
  <div class="eyebrow">Юридическая информация</div>
  <h1>Политика конфиденциальности</h1>
  <div class="placeholder">Текст политики конфиденциальности будет добавлен в ближайшее время.</div>
  <a class="back" href="/">← На главную</a>
</main>
</body>
</html>
